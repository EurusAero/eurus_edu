[aruco]
; 4x4_50/4x4_100/4x4_250/4x4_1000/5x5_50/5x5_100/5x5_250/5x5_1000
dictionary = 4X4_1000
map_path=/home/orangepi/ros2_ws/src/eurus_edu/edu_aruco_navigation/maps/A2026_map.csv

[settings]
aruco_debug = true
camera_topic=/edu/downward_camera
camera_config_path=/home/orangepi/ros2_ws/src/eurus_edu/camera_calib/calibration_data.json
camera_direction=0
; Защита от случайных ArUco маркеров: маркеры, размер которых меньше указанной
; доли (0.0-1.0) от самого большого маркера в кадре, отбрасываются.
; 0.7 = отбрасывать всё, что меньше 70% от самого большого. 0 - фильтр отключён.
min_marker_size_ratio=0.3
